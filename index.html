<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>MY CASH</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f9f2;--card:#fff;--ink:#1d2a1f;--mut:#6b7a6c;--bd:#dfe7d6;--g:#2f7d47;--l:#c6e58a;--soft:#e9f4d8;--bad:#c2452f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#18221b;--ink:#e6efe3;--mut:#93a597;--bd:#263329;--g:#7fd08f;--l:#a6d65a;--soft:#1f2e22;--bad:#ef8a75;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101712;--card:#18221b;--ink:#e6efe3;--mut:#93a597;--bd:#263329;--g:#7fd08f;--l:#a6d65a;--soft:#1f2e22;--bad:#ef8a75;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:12px 14px 100px}
h2{font-size:20px;margin:18px 0 8px}h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,var(--g),#4a9d5f);color:#fff;border:0}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]) .hero{}
.hero .mut{color:#e3f3d3}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;background:var(--l);color:#17301c;min-height:44px;cursor:pointer}
.btn.s{background:var(--soft);color:var(--g)}.btn.d{background:transparent;color:var(--bad)}.btn.w{background:rgba(255,255,255,.2);color:#fff}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px}
.em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.bad{color:var(--bad)}.ok{color:var(--g)}.flex1{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px;font:inherit;font-size:11px;min-height:56px}nav button b{display:block;font-size:20px}nav .on{color:var(--g);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:28px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);min-height:44px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:#223;color:#fff;border-radius:12px;padding:12px;display:none;justify-content:space-between;gap:10px;max-width:536px;margin:auto}
.chk{width:26px;height:26px;accent-color:var(--g);flex:none;min-height:0}.done{text-decoration:line-through;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs .btn{white-space:nowrap}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw span{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw .on{border-color:var(--ink)}
:root{--bg:#E8F3EA;--card:#fff;--ink:#12261B;--mut:#4A6455;--bd:#C9DFCF;--g:#1B8A4B;--l:#1B8A4B;--bt:#fff;--soft:#D5E7DA;--bad:#C23B2E;--hb:#14603A;--hs:#B4DAC2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09100C;--card:#131B16;--ink:#E8F2EB;--mut:#90A598;--bd:#233029;--g:#3DDC84;--l:#3DDC84;--bt:#05130A;--soft:#212D26;--bad:#FF7A6B;--hb:#0E2B1C;--hs:#8DB89F}}
:root[data-theme="dark"]{--bg:#09100C;--card:#131B16;--ink:#E8F2EB;--mut:#90A598;--bd:#233029;--g:#3DDC84;--l:#3DDC84;--bt:#05130A;--soft:#212D26;--bad:#FF7A6B;--hb:#0E2B1C;--hs:#8DB89F}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
h2,h3,.big{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;letter-spacing:-.01em}
.btn{color:var(--bt)}
.hero{background:var(--hb);border-radius:18px;padding:18px;gap:14px}
.hero .mut{color:var(--hs)}
.hero .big{font-size:clamp(42px,13vw,62px);line-height:1;letter-spacing:-.03em}
.hero .grid>div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px}
.hero b{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-weight:500}
.hero .bar{background:rgba(255,255,255,.18);height:10px}
.card{border-radius:14px}
.em{border-radius:11px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.chip{flex:none;border:1px solid var(--bd);background:var(--soft);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font:inherit;cursor:pointer}.chip.on{background:var(--l);color:var(--bt);border-color:var(--l);font-weight:600}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const COLORS=['#2f7d47','#8cc63f','#5aa9a0','#e0a93b','#d9776b','#7d8fd1','#b07fc9','#8a9a5b','#c99a6b','#4f6f52'];
const DEF=[['dorm','Общежитие','🏠',45000],['food','Продукты','🛒',17000],['comm','Связь','📱',1000],['wash','Стирка','🧺',1000],['bus','Автобусы Драу — Местре — Маргера','🚌',1500],['home','Бытовые покупки','🧴',2000],['cloth','Одежда и мелочи','👕',7000],['travel','Путешествия','✈️',24500],['save','Накопления','💰',1000]];
const TC=['Междугородние билеты','Проживание','Питание','Местный транспорт','Развлечения','Музеи и экскурсии','Покупки','Прочее'];
const now=new Date(),tod=now.toISOString().slice(0,10);
const mem={};const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
function fresh(){const lim={};DEF.forEach(d=>lim[d[0]]=d[3]);return{theme:'auto',cats:DEF.map((d,i)=>({id:d[0],name:d[1],emo:d[2],col:COLORS[i%10]})),months:{},tx:[],wd:[],trips:[],lists:[],goals:[],events:[],defLim:lim}}
let S;try{S=JSON.parse(ls.get('mycash')||'null')}catch(e){}S=S||fresh();
const START='2026-11';const ui={tab:'b',m:tod.slice(0,7)<START?START:tod.slice(0,7),trip:null,list:null,f:'all',arch:false};
const save=()=>ls.set('mycash',JSON.stringify(S));
const fmt=c=>(c/100).toLocaleString('ru-RU',{style:'currency',currency:'EUR'});
const cents=v=>Math.round(parseFloat(String(v||0).replace(',','.'))*100)||0;
const inp=c=>(c/100).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const mname=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const shift=(m,d)=>{let y=+m.slice(0,4),n=+m.slice(5)-1+d;y+=Math.floor(n/12);n=((n%12)+12)%12;return y+'-'+String(n+1).padStart(2,'0')};
const days=(a,b)=>a&&b?Math.round((new Date(b)-new Date(a))/864e5)+1:0;
function seed(m){const p=Object.keys(S.months).filter(k=>k<m&&k>=START&&Object.values(S.months[k].lim).some(v=>v>0)).sort().pop();return p?{...S.months[p].lim}:{...S.defLim}}
function month(m){if(!S.months[m]){const lim=seed(m);S.months[m]={budget:Object.values(lim).reduce((a,b)=>a+b,0),planned:null,lim};save()}return S.months[m]}
function sweep(){const cur=tod.slice(0,7);let ch=0,g=S.goals.find(x=>x.id==S.autoGoal);Object.keys(S.months).filter(m=>m>=START&&m<cur).forEach(m=>{const id='sw_'+m;let e=null;S.goals.forEach(x=>{const f=x.hist.find(h=>h.id==id);if(f)e=f});const want=Math.max(0,wallet(m)+(e?e.amt:0));if(e?e.amt==want:!want)return;if(e){if(want)e.amt=want;else S.goals.forEach(x=>x.hist=x.hist.filter(h=>h.id!=id))}else{if(!g){g={id:uid(),name:'Остаток месяцев',target:0,date:'',hist:[]};S.goals.push(g);S.autoGoal=g.id}g.hist.push({id,date:m+'-'+String(new Date(+m.slice(0,4),+m.slice(5),0).getDate()).padStart(2,'0'),amt:want})}ch=1});if(ch)save()}
const cat=id=>S.cats.find(c=>c.id==id)||{name:'Без категории',emo:'❔',col:'#999'};
function allTx(){const t=S.tx.map(x=>({...x,src:'m'}));S.trips.forEach(tr=>tr.exp.forEach(e=>t.push({id:e.id,date:e.date,amt:e.amt,cat:'travel',note:tr.name+': '+e.name,src:'t',ref:tr.id})));S.lists.forEach(l=>{if(l.posted&&l.fact)t.push({id:l.id,date:l.date,amt:l.fact,cat:'food',note:'Закупка: '+l.name,src:'l',ref:l.id})});return t.sort((a,b)=>b.date.localeCompare(a.date))}
const dep=(m)=>S.goals.reduce((s,g)=>s+g.hist.filter(h=>!m||h.date.startsWith(m)).reduce((a,h)=>a+h.amt,0),0);
function wallet(m){return S.wd.filter(w=>w.date.startsWith(m)).reduce((s,w)=>s+w.amt,0)-allTx().filter(t=>t.date.startsWith(m)).reduce((s,t)=>s+t.amt,0)-dep(m)}
function stats(m){const mm=month(m),tx=allTx().filter(t=>t.date.startsWith(m)),sp={};tx.forEach(t=>sp[t.cat]=(sp[t.cat]||0)+t.amt);sp.save=dep(m);const exp=tx.reduce((s,t)=>s+t.amt,0);return{mm,tx,sp,exp,wd:S.wd.filter(w=>w.date.startsWith(m)).reduce((s,w)=>s+w.amt,0)}}
// UI helpers
function toast(msg,undo){const t=$('#toast');t.style.display='flex';t.innerHTML='<span>'+msg+'</span>'+(undo?'<b style="cursor:pointer;color:#c6e58a" onclick="undo()">Отменить</b>':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)}
let snap;function del(fn,msg){snap=JSON.stringify(S);fn();save();R();toast(msg||'Удалено',1)}
function undo(){if(snap){S=JSON.parse(snap);save();R();toast('Возвращено')}}
function closeM(){const m=$('.mod');if(m)m.remove()}
function modal(html){closeM();const d=document.createElement('div');d.className='mod';d.onclick=e=>{if(e.target==d)closeM()};d.innerHTML='<div>'+html+'</div>';document.body.appendChild(d)}
let FN;function form(title,fields,ok,extra){FN=ok;modal('<h3>'+title+'</h3>'+fields.map(f=>{const id='f_'+f.k;let c;if(f.t=='select')c='<select id="'+id+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]==f.v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';else if(f.t=='area')c='<textarea id="'+id+'" rows="3">'+esc(f.v||'')+'</textarea>';else if(f.t=='color')c='<input type="hidden" id="'+id+'" value="'+f.v+'"><div class="sw">'+COLORS.map(x=>'<span style="background:'+x+'" class="'+(x==f.v?'on':'')+'" onclick="this.parentNode.previousSibling.value=\''+x+'\';[...this.parentNode.children].forEach(s=>s.classList.remove(\'on\'));this.classList.add(\'on\')"></span>').join('')+'</div>';else c='<input id="'+id+'" type="'+(f.t=='num'?'text':f.t||'text')+'"'+(f.t=='num'?' inputmode="decimal"':'')+' value="'+esc(f.v??'')+'">';return'<label>'+f.l+'</label>'+c}).join('')+'<div class="row" style="margin-top:16px"><button class="btn flex1" onclick="submitF()">Сохранить</button><button class="btn s" onclick="closeM()">Отмена</button></div>'+(extra||''));FF=fields}
let FF;function submitF(){const v={};FF.forEach(f=>{const x=$('#f_'+f.k).value;v[f.k]=f.t=='num'?cents(x):x});if(FN(v)===false)return;save();closeM();R();toast('Сохранено')}
function ask(msg,fn){modal('<p>'+msg+'</p><div class="row"><button class="btn d flex1" onclick="closeM();ASK()">Да</button><button class="btn s flex1" onclick="closeM()">Нет</button></div>');window.ASK=fn}
const catOpts=()=>S.cats.filter(c=>!c.arch).map(c=>[c.id,c.emo+' '+c.name]);
const bar=(p,col)=>'<div class="bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%;background:'+(p>100?'var(--bad)':col)+'"></i></div>';
// Budget actions
function addExp(id){const t=S.tx.find(x=>x.id==id)||{date:tod.startsWith(ui.m)?tod:ui.m+'-01',cat:'food',note:'',amt:0};form(id?'Изменить расход':'Новый расход',[{k:'amt',l:'Сумма, €',t:'num',v:t.amt?inp(t.amt):''},{k:'date',l:'Дата',t:'date',v:t.date},{k:'cat',l:'Статья',t:'select',o:catOpts(),v:t.cat},{k:'note',l:'Комментарий',v:t.note}],v=>{if(v.amt<=0||!v.date){toast('Введите сумму и дату');return false}if(id)Object.assign(t,v);else S.tx.push({id:uid(),...v})})}
function delExp(id){del(()=>S.tx=S.tx.filter(x=>x.id!=id))}
function addWd(){form('Снятие наличных',[{k:'amt',l:'Сумма, €',t:'num'},{k:'date',l:'Дата',t:'date',v:tod.startsWith(ui.m)?tod:ui.m+'-01'}],v=>{if(v.amt<=0)return false;S.wd.push({id:uid(),...v})})}
function editMonth(){const mm=month(ui.m);form('Месяц: '+mname(ui.m),[{k:'budget',l:'Общий бюджет, €',t:'num',v:inp(mm.budget)},{k:'planned',l:'Планируемое снятие, € (пусто — бюджет минус снятое)',t:'num',v:mm.planned==null?'':inp(mm.planned)},...S.cats.filter(c=>!c.arch).map(c=>({k:'l_'+c.id,l:c.emo+' '+c.name+' — лимит, €',t:'num',v:inp(mm.lim[c.id]||0)}))],v=>{mm.budget=v.budget;mm.planned=$('#f_planned').value===''?null:v.planned;S.cats.forEach(c=>{if('l_'+c.id in v)mm.lim[c.id]=v['l_'+c.id]})})}
function editCat(id){const c=id?cat(id):{name:'',emo:'🙂',col:COLORS[0]},mm=month(ui.m);const i=S.cats.indexOf(c);form(id?'Статья':'Новая статья',[{k:'name',l:'Название',v:c.name},{k:'emo',l:'Эмодзи',v:c.emo},{k:'col',l:'Цвет',t:'color',v:c.col},{k:'lim',l:'Лимит на '+mname(ui.m)+', €',t:'num',v:id?inp(mm.lim[id]||0):''}],v=>{if(!v.name)return false;if(id){Object.assign(c,{name:v.name,emo:v.emo,col:v.col});mm.lim[id]=v.lim}else{const n={id:uid(),name:v.name,emo:v.emo,col:v.col};S.cats.push(n);mm.lim[n.id]=v.lim}},id?'<div class="row" style="margin-top:10px"><button class="btn s" onclick="mv(\''+id+'\',-1)">↑ Выше</button><button class="btn s" onclick="mv(\''+id+'\',1)">↓ Ниже</button><button class="btn d" onclick="rmCat(\''+id+'\')">Удалить</button></div>':'')}
function mv(id,d){const i=S.cats.findIndex(c=>c.id==id),j=i+d;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];save();closeM();R()}
function rmCat(id){const n=allTx().filter(t=>t.cat==id).length;if(!n){del(()=>S.cats=S.cats.filter(c=>c.id!=id));closeM();return}
modal('<h3>В статье есть операции: '+n+'</h3><p class="mut">История не удаляется. Перенесите операции или оставьте статью в архиве.</p><label>Перенести в</label><select id="mvto">'+catOpts().filter(o=>o[0]!=id).map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('')+'</select><div class="row" style="margin-top:14px"><button class="btn flex1" onclick="doMv(\''+id+'\')">Перенести</button><button class="btn s flex1" onclick="doArch(\''+id+'\')">В архив</button></div>')}
function doMv(id){const to=$('#mvto').value;S.tx.forEach(t=>{if(t.cat==id)t.cat=to});S.cats=S.cats.filter(c=>c.id!=id);save();closeM();R();toast('Операции перенесены')}
function doArch(id){cat(id).arch=true;save();closeM();R();toast('Статья в архиве')}
function editEv(id){const e=S.events.find(x=>x.id==id)||{name:'',note:'',from:tod,to:tod,cost:0,trip:''};form(id?'Событие':'Новое событие',[{k:'name',l:'Название',v:e.name},{k:'from',l:'Начало',t:'date',v:e.from},{k:'to',l:'Окончание',t:'date',v:e.to},{k:'cost',l:'Возможные расходы, €',t:'num',v:e.cost?inp(e.cost):''},{k:'trip',l:'Поездка',t:'select',o:[['','— нет —'],...S.trips.map(t=>[t.id,t.name])],v:e.trip},{k:'note',l:'Описание',t:'area',v:e.note}],v=>{if(!v.name||v.to<v.from){toast('Проверьте название и даты');return false}if(id)Object.assign(e,v);else S.events.push({id:uid(),...v})},id?'<button class="btn d" style="margin-top:8px" onclick="del(()=>S.events=S.events.filter(x=>x.id==\''+id+'\'?false:true));closeM()">Удалить</button>':'')}
function budgetView(){const{mm,tx,sp,exp,wd}=stats(ui.m),w=wallet(ui.m),left=mm.planned==null?Math.max(0,mm.budget-wd):mm.planned;
const cs=S.cats.filter(c=>!c.arch||sp[c.id]),real=S.cats.filter(c=>c.id!='save'&&sp[c.id]>0).sort((a,b)=>sp[b.id]-sp[a.id]);
let h='<div class="row sp"><button class="btn s" onclick="ui.m=shift(ui.m,-1);R()">‹</button><b>'+mname(ui.m)+'</b><button class="btn s" onclick="ui.m=shift(ui.m,1);R()">›</button></div>';
h+='<div class="card hero"><div class="mut">Личные финансы — '+mname(ui.m)+'</div><div class="big">'+fmt(w)+'</div><div class="mut">сейчас в кошельке</div><div class="grid" style="margin-top:12px"><div><div class="mut">Бюджет</div><b>'+fmt(mm.budget)+'</b></div><div><div class="mut">Снято за месяц</div><b>'+fmt(wd)+'</b></div><div><div class="mut">Осталось снять</div><b>'+fmt(left)+'</b></div><div><div class="mut">Потрачено</div><b>'+fmt(exp)+'</b></div></div>'+bar(mm.budget?exp/mm.budget*100:0,'#c6e58a')+'<div class="row" style="margin-top:12px"><button class="btn w flex1" onclick="addWd()">Снять наличные</button><button class="btn w flex1" onclick="editMonth()">Суммы и лимиты</button></div></div>';
h+='<button class="btn" style="width:100%" onclick="addExp()">＋ Добавить расход</button><h2>Статьи расходов</h2>';
cs.forEach(c=>{const l=mm.lim[c.id]||0,s=sp[c.id]||0;h+='<div class="card" onclick="editCat(\''+c.id+'\')"><div class="row"><div class="em" style="background:'+c.col+'33">'+c.emo+'</div><div class="flex1"><div class="row sp"><b>'+esc(c.name)+(c.arch?' (архив)':'')+'</b><span>'+fmt(s)+' / '+fmt(l)+'</span></div>'+bar(l?s/l*100:(s?101:0),c.col)+'<div class="mut '+(s>l&&c.id!='save'?'bad':'')+'">'+(c.id=='save'?'отложено в цели':s>l?'превышение '+fmt(s-l):'осталось '+fmt(l-s))+'</div></div></div></div>'});
h+='<button class="btn s" style="width:100%" onclick="editCat()">＋ Новая статья</button>';
const pe=real.map(c=>({c,v:sp[c.id]})),tot=pe.reduce((s,p)=>s+p.v,0);

const sn=m=>MN[+m.slice(5)-1].slice(0,3)+' '+m.slice(2,4);
const dm=d=>d.split('-').reverse().join('.');
function chips(){const n=Math.max(12,diffM(ui.m)+6);let h='<div class="chips">';for(let i=0;i<n;i++){const m=shift(START,i);h+=`<button class="chip${m==ui.m?' on':''}" onclick="ui.m='${m}';R()">${sn(m)}</button>`}return h+'</div>'}
function editMonth(){const{mm,wd}=stats(ui.m);form('Месяц: '+mname(ui.m),[{k:'budget',l:'Бюджет на месяц, €',t:'num',v:inp(mm.budget)},{k:'wd',l:'Уже снято за месяц, €',t:'num',v:inp(wd)},...S.cats.filter(c=>!c.arch).map(c=>({k:'l_'+c.id,l:c.emo+' '+c.name+' — лимит, €',t:'num',v:inp(mm.lim[c.id]||0)}))],v=>{mm.budget=v.budget;const d=v.wd-wd;if(d)S.wd.push({id:uid(),date:ui.m==tod.slice(0,7)?tod:ui.m+'-01',amt:d});S.cats.forEach(c=>{if('l_'+c.id in v)mm.lim[c.id]=v['l_'+c.id]})})}
function wdLeft(){const mm=month(ui.m),l=mm.budget-stats(ui.m).wd;if(l>0){S.wd.push({id:uid(),date:ui.m==tod.slice(0,7)?tod:ui.m+'-01',amt:l});save();R();toast('Весь бюджет снят')}}
function advice(m){const{mm,sp}=stats(m),cur=m==tod.slice(0,7),dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),day=+tod.slice(8),f=cur&&day>=5?dim/day:1;const rows=S.cats.filter(c=>c.id!='save'&&!c.arch).map(c=>{const s=sp[c.id]||0,l=mm.lim[c.id]||0,p=Math.round(s*f/100)*100;return{c,s,l,p,sug:s?p:l}});return{rows,f,cur}}
function applyAdvice(m){const nm=month(shift(m,1));advice(m).rows.forEach(r=>nm.lim[r.c.id]=r.sug);save();R();toast('Лимиты на '+mname(shift(m,1))+' обновлены')}
function budgetView(){const{mm,tx,sp,exp,wd}=stats(ui.m),w=wallet(ui.m),left=Math.max(0,mm.budget-wd),pct=mm.budget?Math.round(wd/mm.budget*100):0,A=advice(ui.m);
let h=chips();
h+=`<div class="card hero"><div class="mut">Личные финансы — ${mname(ui.m)}</div><div class="big">${fmt(w)}</div><div class="mut">сейчас в кошельке</div><div class="grid" style="margin-top:12px"><div><div class="mut">Бюджет на месяц</div><b>${fmt(mm.budget)}</b></div><div><div class="mut">Уже снято</div><b>${fmt(wd)}</b></div><div><div class="mut">Осталось снять</div><b>${fmt(left)}</b></div><div><div class="mut">Потрачено</div><b>${fmt(exp)}</b></div></div>${bar(pct,'#8CF0B2')}<div class="mut">${left?'снято '+pct+'% бюджета':mm.budget?'весь бюджет снят ✓':'бюджет на этот месяц ещё не задан'}</div><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn w flex1" onclick="editMonth()">Бюджет и снятое</button><button class="btn w flex1" onclick="addWd()">＋ Снять</button>${left?`<button class="btn w" style="width:100%" onclick="wdLeft()">Снять весь остаток ${fmt(left)}</button>`:''}</div></div><button class="btn" style="width:100%" onclick="addExp()">＋ Добавить расход</button>`;
const pe=S.cats.filter(c=>c.id!='save'&&sp[c.id]>0).sort((a,b)=>sp[b.id]-sp[a.id]).map(c=>({c,v:sp[c.id]})),tot=pe.reduce((s,p)=>s+p.v,0);let sv='<circle cx="60" cy="60" r="50" fill="var(--soft)"/>';
if(tot){sv='';let a=-Math.PI/2;pe.forEach(p=>{const f=p.v/tot,b=a+f*2*Math.PI,x=t=>(60+50*Math.cos(t)).toFixed(2),y=t=>(60+50*Math.sin(t)).toFixed(2);sv+=f>.999?`<circle cx="60" cy="60" r="50" fill="${p.c.col}"/>`:`<path d="M60 60L${x(a)} ${y(a)}A50 50 0 ${f>.5?1:0} 1 ${x(b)} ${y(b)}Z" fill="${p.c.col}"/>`;a=b})}
h+=`<h2>Куда уходят деньги</h2><div class="card row"><svg viewBox="0 0 120 120" width="130" height="130" style="flex:none">${sv}<circle cx="60" cy="60" r="26" fill="var(--card)"/></svg><div class="flex1">${tot?pe.map(p=>`<div class="row sp" style="font-size:14px"><span>${p.c.emo} ${esc(p.c.name)}</span><span><b>${Math.round(p.v/tot*100)}%</b> <span class="mut">${fmt(p.v)}</span></span></div>`).join(''):'<span class="mut">Диаграмма появится после первой траты</span>'}</div></div>`;
h+='<h2>Итоги и план на следующий месяц</h2><div class="card">';
if(!exp)h+='<p class="mut" style="margin:0">Добавьте траты — здесь появятся итоги, прогноз и рекомендации по лимитам.</p>';else{const over=A.rows.filter(r=>r.s&&r.p>r.l),sav=A.rows.filter(r=>r.s&&r.l&&r.p<r.l*.8),sum=A.rows.reduce((s,r)=>s+r.sug,0)+(mm.lim.save||0),proj=A.rows.reduce((s,r)=>s+r.p,0),diff=sum-mm.budget,pl=A.cur?'прогноз ':'потрачено ';
h+=`<p style="margin-top:0">Потрачено <b>${fmt(exp)}</b> из <b>${fmt(mm.budget)}</b>, остаток бюджета <b class="${mm.budget<exp?'bad':'ok'}">${fmt(mm.budget-exp)}</b>.</p>`;
if(A.cur&&A.f>1)h+=`<p class="mut">Если темп сохранится, к концу месяца будет потрачено около ${fmt(proj)}.</p>`;
if(pe[0])h+=`<p>📊 Больше всего уходит на <b>${pe[0].c.emo} ${esc(pe[0].c.name)}</b> — ${Math.round(pe[0].v/tot*100)}% трат (${fmt(pe[0].v)}).</p>`;
over.forEach(r=>h+=`<p class="bad">⚠️ <b>${esc(r.c.name)}</b>: ${pl}${fmt(r.p)} при лимите ${fmt(r.l)} — поднять лимит на ${fmt(r.p-r.l)} или сократить траты.</p>`);
sav.forEach(r=>h+=`<p class="ok">✅ <b>${esc(r.c.name)}</b>: хватит ${fmt(r.p)} вместо ${fmt(r.l)} — можно освободить ${fmt(r.l-r.p)}.</p>`);
h+=diff>0?`<p>Предлагаемые лимиты на ${mname(shift(ui.m,1))} в сумме ${fmt(sum)} — это на <b class="bad">${fmt(diff)}</b> больше бюджета. Решите, где урезать.</p>`:`<p>Предлагаемые лимиты на ${mname(shift(ui.m,1))}: ${fmt(sum)}. Свободно <b class="ok">${fmt(-diff)}</b> — можно направить в накопления или поездки.</p>`;
h+=`<button class="btn" style="width:100%" onclick="applyAdvice('${ui.m}')">Применить лимиты к месяцу ${sn(shift(ui.m,1))}</button>`}
h+='</div><h2>Статьи расходов</h2>';
S.cats.filter(c=>!c.arch||sp[c.id]).forEach(c=>{const l=mm.lim[c.id]||0,s=sp[c.id]||0;h+=`<div class="card" onclick="editCat('${c.id}')"><div class="row"><div class="em" style="background:${c.col}33">${c.emo}</div><div class="flex1"><div class="row sp"><b>${esc(c.name)}${c.arch?' (архив)':''}</b><span>${fmt(s)} / ${fmt(l)}</span></div>${bar(l?s/l*100:(s?101:0),c.col)}<div class="mut ${s>l&&c.id!='save'?'bad':''}">${c.id=='save'?'отложено в цели':s>l?'превышение '+fmt(s-l):'осталось '+fmt(l-s)}</div></div></div></div>`});
h+=`<button class="btn s" style="width:100%" onclick="editCat()">＋ Новая статья</button><h2>История</h2><select onchange="ui.f=this.value;R()"><option value="all">Все статьи</option>${S.cats.map(c=>`<option value="${c.id}"${ui.f==c.id?' selected':''}>${c.emo} ${esc(c.name)}</option>`).join('')}</select>`;
const hx=tx.filter(t=>ui.f=='all'||t.cat==ui.f);h+=hx.length?hx.map(t=>{const c=cat(t.cat);return`<div class="card row" onclick="${t.src=='m'?`addExp('${t.id}')`:t.src=='t'?`ui.tab='t';ui.trip='${t.ref}';R()`:`ui.tab='g';ui.list='${t.ref}';R()`}"><div class="em" style="background:${c.col}33">${c.emo}</div><div class="flex1"><b>${esc(t.note||c.name)}</b><div class="mut">${dm(t.date)} · ${esc(c.name)}${t.src!='m'?' · из раздела':''}</div></div><b>${fmt(t.amt)}</b>${t.src=='m'?`<button class="btn d" onclick="event.stopPropagation();delExp('${t.id}')">✕</button>`:''}</div>`}).join(''):'<p class="mut">Пока нет трат. Нажмите «Добавить расход».</p>';
const wl=S.wd.filter(x=>x.date.startsWith(ui.m));if(wl.length)h+='<h3 style="margin-top:14px">Снятия наличных</h3>'+wl.map(x=>`<div class="card row sp"><span>${dm(x.date)}</span><b class="ok">${x.amt>0?'+':''}${fmt(x.amt)}</b><button class="btn d" onclick="del(()=>S.wd=S.wd.filter(y=>y.id!='${x.id}'))">✕</button></div>`).join('');
h+='<h2>События</h2>'+S.events.slice().sort((a,b)=>a.from.localeCompare(b.from)).map(e=>{const ov=e.from.slice(0,7)<=ui.m&&e.to.slice(0,7)>=ui.m;return`<div class="card" style="${ov?'':'opacity:.6'}" onclick="editEv('${e.id}')"><b>${esc(e.name)}</b><div class="mut">${dm(e.from)} — ${dm(e.to)} · ${days(e.from,e.to)} дн.${e.cost?' · '+fmt(e.cost):''}${e.trip?' · 🧳 '+esc((S.trips.find(t=>t.id==e.trip)||{}).name||''):''}</div></div>`}).join('')+'<button class="btn s" style="width:100%" onclick="editEv()">＋ Событие</button>';
h+=`<h2>Настройки</h2><div class="card"><label>Тема</label><select onchange="S.theme=this.value;save();applyT()"><option value="auto"${S.theme=='auto'?' selected':''}>Системная</option><option value="light"${S.theme=='light'?' selected':''}>Светлая</option><option value="dark"${S.theme=='dark'?' selected':''}>Тёмная</option></select><div class="row" style="margin-top:12px"><button class="btn s flex1" onclick="expo()">Резервная копия</button><button class="btn s flex1" onclick="impo()">Восстановить</button></div></div>`;return h}
let DB;const idb=()=>DB||(DB=new Promise((ok,no)=>{const r=indexedDB.open('mycash-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const idbDo=(m,fn)=>idb().then(d=>new Promise((ok,no)=>{const q=fn(d.transaction('f',m).objectStore('f'));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const putF=(id,b)=>idbDo('readwrite',s=>s.put(b,id)),getF=id=>idbDo('readonly',s=>s.get(id)),delF=id=>idbDo('readwrite',s=>s.delete(id));
function shrink(f){return new Promise(ok=>{if(!f.type.startsWith('image/')||f.type=='image/gif')return ok(f);const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);ok(b||f)},'image/jpeg',.75)};i.onerror=()=>ok(f);i.src=u})}
const fobj=(k,id)=>(k=='t'?S.trips:S.lists).find(x=>x.id==id);
async function addFiles(k,id,el){const o=fobj(k,id);o.files=o.files||[];let bad=0;for(const f of el.files){if(f.size>15e6){bad++;continue}try{const b=await shrink(f),fid=uid();await putF(fid,b);o.files.push({id:fid,name:f.name,type:b.type||f.type||'',size:b.size})}catch(e){bad++}}el.value='';save();R();toast(bad?'Не удалось добавить файлов: '+bad+' (максимум 15 МБ)':'Файлы добавлены')}
function filesView(k,o){const fs=o.files||[];return `<h2>Файлы и фото</h2><div class="card"><input type="file" id="fi_${k}" multiple style="display:none" onchange="addFiles('${k}','${o.id}',this)"><button class="btn" style="width:100%" onclick="$('#fi_${k}').click()">＋ Добавить фото или файл</button>${fs.length?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${fs.map(f=>`<div onclick="openF('${k}','${o.id}','${f.id}')" style="border:1px solid var(--bd);border-radius:10px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center;background:var(--soft);cursor:pointer">${f.type.startsWith('image/')?`<img data-fid="${f.id}" style="width:100%;height:100%;object-fit:cover" alt="">`:`<div style="text-align:center;padding:6px;font-size:12px;overflow-wrap:anywhere">📄<br>${esc(f.name)}</div>`}</div>`).join('')}</div>`:`<p class="mut" style="margin:10px 0 0">${k=='t'?'Билеты, бронирования, документы и фото поездки.':'Фото чеков и продуктов.'}</p>`}</div>`}
async function openF(k,oid,fid){const f=fobj(k,oid).files.find(x=>x.id==fid);let b;try{b=await getF(fid)}catch(e){}if(!b){toast('Файл не найден на этом устройстве');return}const u=URL.createObjectURL(b);modal(`<h3 style="overflow-wrap:anywhere">${esc(f.name)}</h3><div class="mut">${Math.max(1,Math.round(f.size/1024))} КБ</div>${f.type.startsWith('image/')?`<img src="${u}" style="max-width:100%;border-radius:10px;margin-top:8px">`:f.type=='application/pdf'?`<iframe src="${u}" style="width:100%;height:60vh;border:0;margin-top:8px"></iframe>`:'<p class="mut">Предпросмотр для этого типа файла недоступен.</p>'}<div class="row" style="margin-top:12px"><a class="btn s flex1" style="text-align:center;text-decoration:none;display:grid;place-items:center" href="${u}" download="${esc(f.name)}">Скачать</a><button class="btn d" onclick="rmF('${k}','${oid}','${fid}')">Удалить</button><button class="btn s" onclick="closeM()">Закрыть</button></div>`)}
function rmF(k,oid,fid){closeM();ask('Удалить файл?',()=>{const o=fobj(k,oid);o.files=o.files.filter(x=>x.id!=fid);delF(fid).catch(()=>{});save();R();toast('Файл удалён')})}
function hydrate(){document.querySelectorAll('[data-fid]').forEach(el=>{getF(el.dataset.fid).then(b=>{if(b)el.src=URL.createObjectURL(b)}).catch(()=>{})})}
if(!S.v2){const act=m=>allTx().some(t=>t.date.startsWith(m))||S.wd.some(w=>w.date.startsWith(m))||dep(m)!=0;Object.keys(S.months).forEach(m=>{if(m!=START&&!act(m)){S.months[m].budget=0;S.months[m].lim={}}});S.v2=1;save()}
if(!S.v3){Object.keys(S.months).sort().forEach(m=>{const mm=S.months[m];if(m>START&&!Object.values(mm.lim).some(v=>v>0)&&!(allTx().some(t=>t.date.startsWith(m))||S.wd.some(w=>w.date.startsWith(m)))){const p=Object.keys(S.months).filter(k=>k<m&&k>=START&&Object.values(S.months[k].lim).some(v=>v>0)).sort().pop();if(p){mm.lim={...S.months[p].lim};mm.budget=Object.values(mm.lim).reduce((a,b)=>a+b,0)}}});S.v3=1;save()}
month(ui.m);R();
</script></body></html>
